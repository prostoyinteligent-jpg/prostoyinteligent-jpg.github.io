<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор титульного аркуша — Kursova24</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:#0f172a;background:#f1f5f9}.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;text-align:center}.nav a{margin:0 12px;color:#334155;text-decoration:none;font-weight:500}.container{max-width:700px;margin:0 auto;padding:30px 20px}label{display:block;margin:12px 0 4px;font-weight:500}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}button{margin-top:20px;padding:12px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem}button:hover{background:#1d4ed8}#result{margin-top:30px;background:#fff;padding:24px;border-radius:12px;border:1px solid #e2e8f0;white-space:pre-wrap;font-family:'Times New Roman',serif;font-size:14px;line-height:1.5;display:none}.hint{font-size:.85rem;color:#64748b;margin-top:8px}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">Головна</a>
    <a href="templates.html">Шаблони</a>
    <a href="how-to.html">Як писати</a>
    <a href="generator.html">Генератор</a>
  </nav>
  <div class="container">
    <h1>Генератор титульного аркуша</h1>
    <p class="hint">Заповніть поля → отримаєте готовий текст для Word</p>
    <label>Тип роботи</label>
    <select id="type">
      <option value="kursova">Курсова робота</option>
      <option value="dyplom">Дипломна робота</option>
    </select>
    <label>Університет</label>
    <input id="uni" placeholder="Наприклад: Київський національний університет імені Тараса Шевченка">
    <label>Кафедра</label>
    <input id="kaf" placeholder="Кафедра ...">
    <label>Дисципліна / спеціальність</label>
    <input id="disc" placeholder="">
    <label>Тема роботи</label>
    <input id="tema" placeholder="Повна назва теми">
    <label>ПІБ студента</label>
    <input id="pib" placeholder="Прізвище Ім’я По батькові">
    <label>Курс, група</label>
    <input id="grupa" placeholder="3 курс, група КН-31">
    <label>ПІБ керівника</label>
    <input id="ker" placeholder="Прізвище І. П.">
    <label>Місто</label>
    <input id="misto" value="Київ">
    <button onclick="generate()">Згенерувати</button>
    <div id="result"></div>
    <p class="hint" style="margin-top:20px">Скопіюйте текст і вставте в Word. Встановіть Times New Roman 14, інтервал 1.5, поля 30/15/20 мм.</p>
    <p style="margin-top:20px"><a href="https://kursova24.com">Потрібна готова робота? → kursova24.com</a></p>
  </div>
  <script>
    function generate(){
      const type = document.getElementById('type').value;
      const uni = document.getElementById('uni').value || 'НАЗВА УНІВЕРСИТЕТУ';
      const kaf = document.getElementById('kaf').value || 'Кафедра ________________';
      const disc = document.getElementById('disc').value || '________________';
      const tema = document.getElementById('tema').value || 'НАЗВА ТЕМИ';
      const pib = document.getElementById('pib').value || 'Прізвище Ім’я По батькові';
      const grupa = document.getElementById('grupa').value || '___ курс, група ______';
      const ker = document.getElementById('ker').value || 'Прізвище І. П.';
      const misto = document.getElementById('misto').value || 'Київ';
      let text = '';
      if(type === 'kursova'){
        text = `МІНІСТЕРСТВО ОСВІТИ І НАУКИ УКРАЇНИ\n${uni.toUpperCase()}\n${kaf}\n\n\nКУРСОВА РОБОТА\nз дисципліни «${disc}»\n\nна тему:\n«${tema}»\n\n\n\nСтудента (ки) ${grupa}\n${pib}\n\nКерівник:\n${ker}\n\n\n\n${misto} – 2026`;
      } else {
        text = `МІНІСТЕРСТВО ОСВІТИ І НАУКИ УКРАЇНИ\n${uni.toUpperCase()}\n${kaf}\n\n\nДИПЛОМНА РОБОТА\nна здобуття освітнього ступеня «бакалавр»\n\nна тему:\n«${tema}»\n\n\n\nВиконав(ла): ${grupa}\n${pib}\n\nКерівник:\n${ker}\n\n\n\n${misto} – 2026`;
      }
      const res = document.getElementById('result');
      res.style.display = 'block';
      res.textContent = text;
    }
  </script>
</body>
</html>
