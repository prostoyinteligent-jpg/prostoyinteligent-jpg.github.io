<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор титульного аркуша — Kursova24</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;color:#0f172a;background:#f1f5f9}.nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;text-align:center;position:sticky;top:0}.nav a{margin:0 7px;color:#334155;text-decoration:none;font-weight:500;font-size:.88rem}.container{max-width:720px;margin:0 auto;padding:30px 20px}h1{margin-bottom:6px} .hint{color:#64748b;font-size:.9rem;margin-bottom:20px}label{display:block;margin:14px 0 4px;font-weight:500;font-size:.95rem}input,select{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}button{margin-top:18px;padding:12px 22px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem;margin-right:8px}button:hover{background:#1d4ed8}button.secondary{background:#64748b}#result{margin-top:28px;background:#fff;padding:28px;border-radius:12px;border:1px solid #e2e8f0;white-space:pre-wrap;font-family:'Times New Roman',Times,serif;font-size:15px;line-height:1.55;display:none;position:relative}.copy-btn{position:absolute;top:12px;right:12px;padding:6px 12px;font-size:.85rem;background:#0f172a;color:#fff;border:none;border-radius:6px;cursor:pointer}.success{color:#16a34a;font-size:.9rem;margin-top:8px;display:none}a.order{display:inline-block;margin-top:24px;color:#2563eb;font-weight:500}
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">Головна</a>
    <a href="templates.html">Шаблони</a>
    <a href="how-to.html">Як писати</a>
    <a href="generator.html">Генератор</a>
    <a href="check.html">Перевірка</a>
    <a href="faq.html">FAQ</a>
  </nav>
  <div class="container">
    <h1>Генератор титульного аркуша</h1>
    <p class="hint">Заповніть поля → натисніть «Згенерувати» → скопіюйте в Word</p>
    <label>Тип роботи</label>
    <select id="type">
      <option value="kursova">Курсова робота</option>
      <option value="dyplom">Дипломна робота (бакалавр)</option>
      <option value="magistr">Магістерська робота</option>
    </select>
    <label>Університет (повна назва)</label>
    <input id="uni" placeholder="Київський національний університет імені Тараса Шевченка">
    <label>Факультет / Інститут</label>
    <input id="fac" placeholder="Факультет економіки">
    <label>Кафедра</label>
    <input id="kaf" placeholder="Кафедра фінансів">
    <label>Дисципліна (для курсової)</label>
    <input id="disc" placeholder="Економіка підприємства">
    <label>Тема роботи</label>
    <input id="tema" placeholder="Повна назва теми">
    <label>ПІБ студента</label>
    <input id="pib" placeholder="Шевченко Олена Іванівна">
    <label>Курс і група</label>
    <input id="grupa" placeholder="4 курс, група ЕК-41">
    <label>ПІБ керівника + звання</label>
    <input id="ker" placeholder="к.е.н., доцент Петренко І. П.">
    <label>Місто</label>
    <input id="misto" value="Київ">
    <label>Рік</label>
    <input id="year" value="2026">
    <button onclick="generate()">Згенерувати</button>
    <button class="secondary" onclick="clearAll()">Очистити</button>
    <div id="result">
      <button class="copy-btn" onclick="copyResult()">Скопіювати</button>
      <div id="resultText"></div>
    </div>
    <div id="copySuccess" class="success">Скопійовано!</div>
    <a class="order" href="https://kursova24.com" target="_blank">Потрібна готова робота? → kursova24.com</a>
  </div>
  <script>
    function generate() {
      const type = document.getElementById('type').value;
      const uni = document.getElementById('uni').value.trim() || 'НАЗВА УНІВЕРСИТЕТУ';
      const fac = document.getElementById('fac').value.trim();
      const kaf = document.getElementById('kaf').value.trim() || 'Кафедра ________________';
      const disc = document.getElementById('disc').value.trim() || '________________';
      const tema = document.getElementById('tema').value.trim() || 'НАЗВА ТЕМИ';
      const pib = document.getElementById('pib').value.trim() || 'Прізвище Ім’я По батькові';
      const grupa = document.getElementById('grupa').value.trim() || '___ курс, група ______';
      const ker = document.getElementById('ker').value.trim() || 'Прізвище І. П.';
      const misto = document.getElementById('misto').value.trim() || 'Київ';
      const year = document.getElementById('year').value.trim() || '2026';
      let title = 'КУРСОВА РОБОТА', subtitle = `з дисципліни «${disc}»`, studentLine = `Студента (ки) ${grupa}`;
      if (type === 'dyplom') { title = 'ДИПЛОМНА РОБОТА'; subtitle = 'на здобуття освітнього ступеня «бакалавр»'; studentLine = `Виконав(ла): ${grupa}`; }
      if (type === 'magistr') { title = 'МАГІСТЕРСЬКА РОБОТА'; subtitle = 'на здобуття освітнього ступеня «магістр»'; studentLine = `Виконав(ла): ${grupa}`; }
      let text = 'МІНІСТЕРСТВО ОСВІТИ І НАУКИ УКРАЇНИ\n' + uni.toUpperCase() + '\n';
      if (fac) text += fac + '\n';
      text += kaf + '\n\n\n' + title + '\n' + subtitle + '\n\nна тему:\n«' + tema + '»\n\n\n\n' + studentLine + '\n' + pib + '\n\nКерівник:\n' + ker + '\n\n\n\n' + misto + ' – ' + year;
      document.getElementById('resultText').textContent = text;
      document.getElementById('result').style.display = 'block';
      document.getElementById('copySuccess').style.display = 'none';
    }
    function copyResult() {
      navigator.clipboard.writeText(document.getElementById('resultText').textContent).then(() => {
        document.getElementById('copySuccess').style.display = 'block';
        setTimeout(() => document.getElementById('copySuccess').style.display = 'none', 2000);
      });
    }
    function clearAll() {
      ['uni','fac','kaf','disc','tema','pib','grupa','ker'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('misto').value = 'Київ';
      document.getElementById('year').value = '2026';
      document.getElementById('result').style.display = 'none';
    }
  </script>
</body>
</html>
